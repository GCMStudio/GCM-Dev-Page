<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        body{
            background: #111;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box{
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        input{
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }

        button{
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #resultado{
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login</h2>

        <input type="text" id="username" placeholder="Usuário">
        <input type="password" id="password" placeholder="Senha">

        <button onclick="fazerLogin()">Entrar</button>

        <div id="resultado"></div>
    </div>

    <script>
        async function fazerLogin() {

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const response = await fetch("http://localhost:3000/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

            const data = await response.json();

            document.getElementById("resultado").innerText = data.message;
        }
    </script>

</body>
</html>
